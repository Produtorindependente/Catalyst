<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cantinho Bom — Administração</title>

<link rel="stylesheet" href="admin.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<section id="loginTela" class="login-tela">

    <div class="login-box">

        <h1>CANTINHO BOM</h1>

        <p>Administração do catálogo</p>

        <form id="loginForm">

            <label>
                E-mail
                <input
                    id="loginEmail"
                    type="email"
                    autocomplete="username"
                    required
                >
            </label>

            <label>
                Senha
                <input
                    id="loginSenha"
                    type="password"
                    autocomplete="current-password"
                    required
                >
            </label>

            <button type="submit">
                Entrar
            </button>

            <p id="loginMensagem"></p>

        </form>

    </div>

</section>


<!-- =========================
     PAINEL
========================= -->

<section id="painelTela" class="painel-tela">

<header>

    <div>
        <h1>CANTINHO BOM</h1>
        <small>Administração do catálogo</small>
    </div>

    <button id="sair">
        Sair
    </button>

</header>

<main>

    <section class="resumo">

        <div>
            <span>Total</span>
            <strong id="total">0</strong>
        </div>

        <div>
            <span>Ativos</span>
            <strong id="ativos">0</strong>
        </div>

        <div>
            <span>Inativos</span>
            <strong id="inativos">0</strong>
        </div>

    </section>


    <section class="barra">

        <input
            id="busca"
            type="search"
            placeholder="Buscar produto..."
        >

        <button id="novo">
            + Novo produto
        </button>

    </section>


    <p id="mensagem"></p>


    <section class="tabela">

        <table>

            <thead>

                <tr>
                    <th>ID</th>
                    <th>Produto</th>
                    <th>Categoria</th>
                    <th>Preço</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>

            </thead>

            <tbody id="lista"></tbody>

        </table>

    </section>

</main>


<!-- MODAL -->

<div id="modal">

    <div class="modal-box">

        <button id="fechar">
            ×
        </button>

        <h2 id="titulo">
            Novo produto
        </h2>

        <form id="form">

            <input
                type="hidden"
                id="id"
            >

            <label>
                Nome
                <input
                    id="nome"
                    required
                >
            </label>

            <label>
                Descrição
                <textarea id="descricao"></textarea>
            </label>

            <div class="dupla">

                <label>
                    Preço
                    <input
                        id="preco"
                        type="number"
                        step="0.01"
                        required
                    >
                </label>

                <label>
                    Preço anterior
                    <input
                        id="preco_anterior"
                        type="number"
                        step="0.01"
                    >
                </label>

            </div>

            <div class="dupla">

                <label>
                    Marca
                    <input id="marca">
                </label>

                <label>
                    Categoria
                    <input
                        id="categoria"
                        required
                    >
                </label>

            </div>

            <div class="dupla">

                <label>
                    Peso
                    <input id="peso">
                </label>

                <label>
                    Unidade
                    <input id="unidade">
                </label>

            </div>

            <label>
                Código
                <input id="codigo">
            </label>

            <label>
    Imagem por URL
    <input
        id="imagem"
        type="url"
        placeholder="https://..."
    >
</label>

<label>
    📷 Enviar imagem
    <input
        id="imagemArquivo"
        type="file"
        accept="image/*"
    >
    <small>
        Escolha uma foto do computador ou celular.
    </small>
</label>
            <label class="check">

                <input
                    type="checkbox"
                    id="ativo"
                    checked
                >

                Produto ativo

            </label>

            <label class="check">

    <input
        type="checkbox"
        id="destaque"
    >

    Produto em destaque

</label>

<label class="check">

    <input
        type="checkbox"
        id="vendaPeso"
    >

    ⚖️ Venda por peso

</label>

            <div class="acoes">

                <button
                    type="button"
                    id="cancelar"
                >
                    Cancelar
                </button>

                <button type="submit">
                    Salvar produto
                </button>

            </div>

        </form>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/heic-to@1.5.2/dist/iife/heic-to.js"></script>
<script src="admin.js?v=4"></script>

</body>
</html>
